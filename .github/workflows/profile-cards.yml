name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml
      - .github/scripts/stats_cards.py

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cartões
        env:
          # Token pessoal (escopo "repo") salvo no secret PROFILE_CARDS_TOKEN, para
          # contar também os repositórios privados. Só números agregados vão para
          # os cartões; nenhum código ou nome de repositório privado é exibido.
          GH_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN }}
        run: python3 .github/scripts/stats_cards.py stats

      - name: Salvar cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Atualizar cartões de estatísticas"
          git push
